apiVersion: v1
kind: Namespace
metadata: { name: finplan }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: finplan-config, namespace: finplan }
data:
  REDIS_HOST: redis
  KAFKA_BOOTSTRAP: kafka:9092
  PLANNER_URL: http://planner-service:8083
  AUTH_URL: http://auth-service:8081
  FINANCE_URL: http://finance-service:8082
  CORS_ORIGINS: http://finplan.local
---
# Placeholder values for local clusters only. In a real cluster create this from your secret manager
# (External Secrets, Sealed Secrets, Vault); never commit real values.
apiVersion: v1
kind: Secret
metadata: { name: finplan-secrets, namespace: finplan }
type: Opaque
stringData:
  JWT_SECRET: "k8s-local-secret-change-me-at-least-32-bytes!!"
  DB_USER: finplan
  DB_PASSWORD: finplan

spec: { selector: { app: planner-service }, ports: [{ port: 8083, targetPort: 8083 }] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: planner-service, namespace: finplan }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: planner-service }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }

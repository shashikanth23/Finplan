apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: finplan }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: finplan/frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          readinessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: finplan }
spec: { selector: { app: frontend }, ports: [{ port: 80, targetPort: 80 }] }

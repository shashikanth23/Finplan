apiVersion: apps/v1
kind: Deployment
metadata: { name: auth-service, namespace: finplan }
spec:
  replicas: 2
  selector: { matchLabels: { app: auth-service } }
  template:
    metadata:
      labels: { app: auth-service }
      annotations: { prometheus.io/scrape: "true", prometheus.io/path: /actuator/prometheus, prometheus.io/port: "8081" }
    spec:
      containers:
        - name: auth-service
          image: finplan/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8081 }]
          env:
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: finplan-secrets, key: JWT_SECRET } } }
            - { name: DB_URL, value: "jdbc:postgresql://auth-db:5432/authdb" }
            - { name: DB_USER, valueFrom: { secretKeyRef: { name: finplan-secrets, key: DB_USER } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: finplan-secrets, key: DB_PASSWORD } } }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          startupProbe: { httpGet: { path: /actuator/health/liveness, port: 8081 }, failureThreshold: 30, periodSeconds: 5 }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8081 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8081 }, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: auth-service, namespace: finplan }
spec: { selector: { app: auth-service }, ports: [{ port: 8081, targetPort: 8081 }] }
---

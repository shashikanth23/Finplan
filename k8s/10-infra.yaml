# Local-cluster infrastructure. In production prefer managed Postgres/Redis/Kafka over these single pods.
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: auth-db, namespace: finplan }
spec:
  serviceName: auth-db
  replicas: 1
  selector: { matchLabels: { app: auth-db } }
  template:
    metadata: { labels: { app: auth-db } }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - { name: POSTGRES_DB, value: authdb }
            - { name: POSTGRES_USER, valueFrom: { secretKeyRef: { name: finplan-secrets, key: DB_USER } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: finplan-secrets, key: DB_PASSWORD } } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe: { exec: { command: ["pg_isready", "-U", "finplan"] }, periodSeconds: 5 }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: ["ReadWriteOnce"], resources: { requests: { storage: 1Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: auth-db, namespace: finplan }
spec: { selector: { app: auth-db }, ports: [{ port: 5432 }] }
---

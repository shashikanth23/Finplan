# Requires an ingress controller (e.g. ingress-nginx). Add "127.0.0.1 finplan.local" to /etc/hosts for a local cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: finplan, namespace: finplan }
spec:
  ingressClassName: nginx
  rules:
    - host: finplan.local
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: gateway, port: { number: 8080 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: frontend, port: { number: 80 } } } }

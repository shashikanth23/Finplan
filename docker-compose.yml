# Infrastructure only:        docker compose up -d
# Whole system in containers: docker compose --profile apps up --build   (UI on http://localhost:3000)
services:
  auth-db:
    image: postgres:16
    environment: { POSTGRES_DB: authdb, POSTGRES_USER: finplan, POSTGRES_PASSWORD: finplan }
    ports: ["5433:5432"]
    volumes: [auth-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U finplan -d authdb"], interval: 5s, retries: 12 }

  finance-db:
    image: postgres:16
    environment: { POSTGRES_DB: financedb, POSTGRES_USER: finplan, POSTGRES_PASSWORD: finplan }
    ports: ["5434:5432"]
    volumes: [finance-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U finplan -d financedb"], interval: 5s, retries: 12 }

  redis:
    image: redis:7
    ports: ["6379:6379"]

  kafka:                       # single-node KRaft broker; INTERNAL for containers, EXTERNAL for apps run from the IDE
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  auth-service:
    profiles: [apps]
    build: { context: ., dockerfile: auth-service/Dockerfile }
    environment:
      DB_URL: jdbc:postgresql://auth-db:5432/authdb
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-at-least-32-bytes!!}
    depends_on: { auth-db: { condition: service_healthy } }

  planner-service:
    profiles: [apps]
    build: { context: ., dockerfile: planner-service/Dockerfile }
    environment:
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-at-least-32-bytes!!}

  finance-service:
    profiles: [apps]
    build: { context: ., dockerfile: finance-service/Dockerfile }
    environment:
      DB_URL: jdbc:postgresql://finance-db:5432/financedb
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:19092
      PLANNER_URL: http://planner-service:8083
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-at-least-32-bytes!!}
    depends_on: { finance-db: { condition: service_healthy }, kafka: { condition: service_started }, redis: { condition: service_started } }

  notification-service:
    profiles: [apps]
    build: { context: ., dockerfile: notification-service/Dockerfile }
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
    depends_on: [kafka]

  gateway:
    profiles: [apps]
    build: { context: ., dockerfile: gateway/Dockerfile }
    environment:
      REDIS_HOST: redis
      AUTH_URL: http://auth-service:8081
      PLANNER_URL: http://planner-service:8083
      FINANCE_URL: http://finance-service:8082
      CORS_ORIGINS: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-at-least-32-bytes!!}
    ports: ["8080:8080"]
    depends_on: [redis, auth-service, planner-service, finance-service]

  frontend:
    profiles: [apps]
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [gateway]

volumes:
  auth-data:
  finance-data:

server:
  port: 8080
spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ORIGINS:http://localhost:5173}
            allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
            allowedHeaders: "*"
      default-filters:
        # Token bucket in Redis: 20 requests/second sustained, bursts up to 40, per client IP.
        # If Redis is unreachable the limiter lets traffic through (fails open) rather than taking the API down.
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@clientIpKeyResolver}"
      routes:
        - id: auth
          uri: ${AUTH_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        - id: planner
          uri: ${PLANNER_URL:http://localhost:8083}
          predicates:
            - Path=/api/planner/**
        - id: finance
          uri: ${FINANCE_URL:http://localhost:8082}
          predicates:
            - Path=/api/profile/**,/api/incomes/**,/api/expenses/**,/api/debts/**,/api/goals/**,/api/dashboard/**
finplan:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-at-least-32-bytes!!}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
